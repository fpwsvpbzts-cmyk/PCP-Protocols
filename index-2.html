<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone first. Auto-hiding top bar (age + section), page column, fixed bottom bar (protocol jump, page counter, top). Tap a page for full-screen pinch zoom. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5b6774; --line:#d5dbe2;
  --accent:#b3261e; --accent-ink:#ffffff; --chip:#e3e8ee; --sheet-shadow:0 1px 2px rgba(20,30,40,.12),0 4px 14px rgba(20,30,40,.08);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1b222a; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2c3640;
  --accent:#ef5a4f; --accent-ink:#1a0d0c; --chip:#25303a; --sheet-shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1b222a; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2c3640;
  --accent:#ef5a4f; --accent-ink:#1a0d0c; --chip:#25303a; --sheet-shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:960px;margin:0 auto}
@media (min-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);transition:transform .22s ease}
header.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
header .wrap{padding-block:8px 8px;display:grid;gap:8px}
header .wrap>*{min-width:0}
.ages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:var(--chip);padding:3px;border-radius:10px}
.ages button{border:0;border-radius:8px;background:transparent;min-height:42px;padding:4px 2px;display:grid;place-content:center;gap:0;min-width:0}
.ages b{font-family:var(--display);font-weight:600;font-size:clamp(.78rem,3.9vw,1.1rem);letter-spacing:.01em;line-height:1.1;white-space:nowrap}
@media (min-width:600px){.ages b{text-transform:uppercase;letter-spacing:.03em}}
.ages small{display:none;font-size:.7rem;color:var(--muted);white-space:nowrap}
.ages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ages button[aria-pressed="true"] small{color:inherit;opacity:.85}
@media (min-width:600px){.ages small{display:block}}
.secs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding-inline:12px;scroll-padding-inline:12px;-webkit-overflow-scrolling:touch}
.secs::-webkit-scrollbar{display:none}
.secs button{flex:none;font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.02em;border:1px solid var(--line);background:var(--panel);padding:0 14px;min-height:38px;border-radius:999px;white-space:nowrap}
.secs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.secs button .n{font-family:var(--body);font-weight:500;font-size:.75rem;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
@media (min-width:760px){.secs{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}

/* pages */
main .wrap{padding-block:12px 40px}
.tools{display:flex;gap:8px;align-items:center}
.sec-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h1{font-family:var(--display);font-size:1.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.1}
.sec-head p{margin:0;color:var(--muted);font-size:.85rem}
#pages{display:grid;gap:16px}
.page{display:grid;gap:5px;scroll-margin-top:12px}
.page .lbl{display:flex;gap:2px 8px;align-items:baseline;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.page .lbl b{font-family:var(--display);font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.page .lbl .pt{color:var(--accent);font-weight:600}
.sheet{display:block;width:100%;padding:0;border:0;background:#fff;box-shadow:var(--sheet-shadow);position:relative;border-radius:2px;overflow:hidden}
.sheet canvas{display:block;width:100%;height:100%}
.sheet .wait{position:absolute;inset:0;display:grid;place-items:center;color:#7a8794;font-size:.8rem}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 10px}
.off{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 14px}
.off span{flex:1 1 12em;min-width:0}
.off button{min-height:40px;padding:0 14px;border-radius:8px;border:0;background:var(--ink);color:var(--panel);font-weight:600;font-size:.85rem}
.off.done{border-color:transparent;background:transparent;padding:0}
.err{padding:16px;border:1px solid var(--accent);border-radius:8px}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bbar .wrap{display:flex;gap:8px;align-items:center;min-height:var(--bar);padding-block:8px}
.jumpbox{flex:1;min-width:0;position:relative}
.jumpbox select{width:100%;min-height:44px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-weight:500;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.jumpbox::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pgc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:3.6em;text-align:center}
.icon{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* full-screen viewer */
.lb{position:fixed;inset:0;z-index:30;background:#0d1114;color:#e9eef2;touch-action:none;overscroll-behavior:contain;display:grid;grid-template-rows:auto 1fr auto}
.lb[hidden]{display:none}
.lb-top,.lb-bot{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:rgba(13,17,20,.92);z-index:2}
.lb-bot{padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-between}
.lb-title{flex:1;min-width:0;font-size:.85rem;line-height:1.25}
.lb-title b{display:block;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.lb-title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ff8a80}
.lb .icon{background:#1d2429;border-color:#2e3840;color:#e9eef2}
.lb .icon:disabled{opacity:.35}
.lb-stage{position:relative;overflow:hidden}
.lb-canvas{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;will-change:transform}
.lb-z{font-size:.8rem;color:#9fb0bd;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){header{transition:none}}
</style>
</head>

rotocols":[{"t":"TRI.01 Newborn Triage","i":0}]}]}];
const base = document.baseURI;
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('pdfjs/pdf.worker.min.js', base).href;
const $ = id => document.getElementById(id);
const docs = new Map();
let state = {g: DATA[0], s: null}, tokenN = 0, near, far, pageEls = [];

function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}
/* ---------- offline storage (IndexedDB, this phone only) ---------- */
let dbP=null;
function db(){
  if(!dbP) dbP=new Promise((res)=>{
    try{
      const r=indexedDB.open('pcp-offline',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('files');
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null);
    }catch(e){res(null)}
  });
  return dbP;
}
async function idb(mode,fn){
  const d=await db(); if(!d) return null;
  return new Promise(res=>{
    try{ const tx=d.transaction('files',mode), st=tx.objectStore('files'), rq=fn(st);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null);
    }catch(e){res(null)}
  });
}
const idbGet=k=>idb('readonly',st=>st.get(k));
const idbPut=(k,v)=>idb('readwrite',st=>st.put(v,k));
const idbKeys=()=>idb('readonly',st=>st.getAllKeys());
const ALL_FILES=DATA.flatMap(g=>g.sections.map(s=>s.file));
const saved=new Set();
async function fetchFile(file){
  let buf=await idbGet(file);
  if(!buf){
    const r=await fetch(new URL(file,base).href);
    if(!r.ok) throw new Error('fetch');
    buf=await r.arrayBuffer();
    await idbPut(file,buf.slice(0));
  }
  saved.add(file); updateOffline();
  return buf;
}
function getDoc(file){
  if(!docs.has(file)){
    const p=fetchFile(file).then(buf=>pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise);
    p.catch(()=>docs.delete(file));
    docs.set(file,p);
  }
  return docs.get(file);
}
let saving=false;
function updateOffline(){
  const n=ALL_FILES.filter(f=>saved.has(f)).length, all=n===ALL_FILES.length;
  $('offTxt').textContent = all ? 'All protocols are saved on this device. The site works without a signal.'
    : saving ? `Saving for offline… ${n} of ${ALL_FILES.length} sections`
    : `${n} of ${ALL_FILES.length} sections saved on this device.`;
  $('offBtn').hidden = all || saving;
  $('off').classList.toggle('done',all);
}
async function saveAll(){
  saving=true; updateOffline();
  try{ for(const f of ALL_FILES){ if(!saved.has(f)) await fetchFile(f); } }
  catch(e){ saving=false; updateOffline(); $('offTxt').textContent+=' Saving stopped. Check your signal and try again.'; return; }
  saving=false; updateOffline();
}
idbKeys().then(keys=>{ (keys||[]).forEach(k=>{ if(ALL_FILES.includes(k)) saved.add(k) }); updateOffline(); });
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

/* ---------- controls ---------- */
function drawAges(){
  $('ages').innerHTML='';
  DATA.forEach(g=>{
    const b=document.createElement('button');
    b.innerHTML=`<b>${g.name}</b><small>${g.ages}</small>`;
    b.setAttribute('aria-pressed', g===state.g);
    b.onclick=()=>{
      const same=g.sections.find(s=>s.id===state.s.id && s.id!=='index');
      select(g, same || g.sections.find(s=>s.id!=='index'));
    };
    $('ages').append(b);
  });
}
function drawSecs(){
  const box=$('secs'); box.innerHTML='';
  state.g.sections.forEach(s=>{
    const b=document.createElement('button');
    b.innerHTML=`${s.name}<span class="n">${s.pages.length}</span>`;
    b.setAttribute('aria-pressed', s===state.s);
    b.onclick=()=>select(state.g,s);
    box.append(b);
    if(s===state.s) requestAnimationFrame(()=>{ box.scrollLeft = b.offsetLeft - box.clientWidth/2 + b.offsetWidth/2; });
  });
}
function drawJump(){
  const j=$('jump'); j.innerHTML='';
  const ps=state.s.protocols;
  const first=document.createElement('option');
  first.textContent = ps.length ? `Protocols (${ps.length})` : 'Contents pages';
  first.value=''; j.append(first);
  ps.forEach(p=>{const o=document.createElement('option');o.value=p.i;o.textContent=p.t;j.append(o)});
  j.disabled=!ps.length;
}
function protoFor(i){let t='';for(const p of state.s.protocols){if(p.i<=i)t=p.t;else break}return t}

function select(g,s,{scroll=true}={}){
  state.g=g; state.s=s;
  const token=`${g.id}-${s.id}`;
  try{history.replaceState(null,'','#'+token)}catch(e){}
  store('pcp-view',token);
  drawAges(); drawSecs(); drawJump();
  $('secTitle').textContent=`${g.name} · ${s.name}`;
  $('secMeta').textContent=`${g.ages} · ${s.pages.length} page${s.pages.length>1?'s':''}`;
  buildPages();
  if(scroll) window.scrollTo(0,0);
  showHeader(true);
}

/* ---------- page list with lazy render + unload ---------- */
function dpr(){return Math.min(window.devicePixelRatio||1,2)}
function buildPages(){
  const tok=++tokenN, s=state.s, wrap=$('pages');
  wrap.innerHTML=''; pageEls=[];
  if(near) near.disconnect(); if(far) far.disconnect();
  near=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) renderThumb(e.target,tok); }),{rootMargin:'1200px 0px'});
  far=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) unload(e.target); }),{rootMargin:'4000px 0px'});
  getDoc(s.file).then(async doc=>{
    if(tok!==tokenN) return;
    for(let i=0;i<s.pages.length;i++){
      const page=await doc.getPage(i+1);
      if(tok!==tokenN) return;
      const vp=page.getViewport({scale:1});
      const el=document.createElement('section'); el.className='page'; el.id='pg'+i;
      const pt=protoFor(i);
      el.innerHTML=`<div class="lbl"><b>Page ${s.pages[i]}</b><span>of ${state.g.name} PDF</span>${pt?`<span class="pt">${pt}</span>`:''}</div><button class="sheet" aria-label="Open page ${s.pages[i]} full screen"><div class="wait">Loading page…</div></button>`;
      el.querySelector('.sheet').style.aspectRatio=`${vp.width} / ${vp.height}`;
      el.querySelector('.sheet').onclick=()=>openLb(i);
      el._page=page; el._i=i;
      wrap.append(el); pageEls.push(el); near.observe(el); far.observe(el);
    }
    updateCounter();
  }).catch(()=>{ if(tok===tokenN) wrap.innerHTML='<div class="err">This section could not load. Check your signal and tap the section again.</div>'; });
}
async function renderThumb(el,tok){
  if(el._state==='busy'||el._state==='done') return;
  el._state='busy';
  const sh=el.querySelector('.sheet'), w=sh.clientWidth||360;
  const page=el._page, scale=w*dpr()/page.getViewport({scale:1}).width;
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
  try{ await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; }catch(e){ el._state=''; return; }
  if(tok!==tokenN) return;
  sh.innerHTML=''; sh.append(c); el._state='done'; el._w=w;
}
function unload(el){
  if(el._state!=='done') return;
  const c=el.querySelector('canvas'); if(c){c.width=0;c.height=0;}
  el.querySelector('.sheet').innerHTML='<div class="wait">Loading page…</div>'; el._state='';
}
function rerenderVisible(){
  pageEls.forEach(el=>{ if(el._state==='done' && Math.abs(el.querySelector('.sheet').clientWidth-el._w)>40){ unload(el); near.unobserve(el); near.observe(el);} });
}

/* ---------- scroll: auto-hide header, page counter ---------- */
let lastY=window.scrollY, ticking=false;
function showHeader(v){$('hdr').classList.toggle('hide',!v)}
function updateCounter(){
  if(!pageEls.length){$('pgc').textContent='';return}
  const mid=window.innerHeight*0.4; let cur=0;
  for(const el of pageEls){ if(el.getBoundingClientRect().top<mid) cur=el._i; else break; }
  $('pgc').textContent=`${cur+1} / ${pageEls.length}`;
}
window.addEventListener('scroll',()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const y=window.scrollY, dy=y-lastY;
    if(y<80) showHeader(true); else if(dy>6) showHeader(false); else if(dy<-10) showHeader(true);
    lastY=y; updateCounter(); ticking=false;
  });
},{passive:true});

$('jump').onchange=e=>{
  const v=e.target.value; if(v==='') return;
  const el=$('pg'+v);
  if(el){ el.scrollIntoView({block:'start'}); setTimeout(()=>showHeader(false),50); }
  e.target.value='';
};
$('offBtn').onclick=saveAll;
$('toTop').onclick=()=>{ window.scrollTo(0,0); showHeader(true); };
let rt, lastW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;rerenderVisible()}},250)});

/* ---------- full-screen viewer with pinch zoom ---------- */
const lb=$('lb'), stage=$('stage');
let cur=-1, cv=null, base0={w:0,h:0}, z={s:1,x:0,y:0}, lbTok=0;
function openLb(i){ lb.hidden=false; document.body.style.overflow='hidden'; showLbPage(i); $('lbX').focus({preventScroll:true}); }
function closeLb(){
  lb.hidden=true; document.body.style.overflow='';
  if(cv){cv.width=0;cv.height=0;cv.remove();cv=null}
  const el=pageEls[cur]; if(el) el.scrollIntoView({block:'start'});
}
async function showLbPage(i){
  if(i<0||i>=pageEls.length) return;
  cur=i; const t=++lbTok, s=state.s;
  $('lbT').textContent=`Page ${s.pages[i]} · ${i+1} of ${s.pages.length}`;
  $('lbP').textContent=protoFor(i)||`${state.g.name} ${s.name}`;
  $('lbPrev').disabled=i===0; $('lbNext').disabled=i===pageEls.length-1;
  const page=pageEls[i]._page, v1=page.getViewport({scale:1});
  const W=stage.clientWidth, H=stage.clientHeight;
  const fit=Math.min(W/v1.width, H/v1.height);
  base0={w:v1.width*fit, h:v1.height*fit};
  // render sharp enough for ~3x zoom, capped by pixel budget
  let scale=fit*dpr()*3; const px=v1.width*v1.height*scale*scale;
  if(px>14e6) scale*=Math.sqrt(14e6/px);
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas'); c.className='lb-canvas';
  c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
  c.style.width=base0.w+'px'; c.style.height=base0.h+'px';
  // show the list thumbnail immediately while the sharp version renders
  const thumb=pageEls[i].querySelector('canvas');
  if(thumb&&thumb.width) c.getContext('2d').drawImage(thumb,0,0,c.width,c.height);
  if(cv){cv.width=0;cv.height=0;cv.remove()}
  cv=c; stage.append(c); resetZoom();
  try{ await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; }catch(e){}
  if(t!==lbTok){c.width=0;c.height=0;}
}
function clampZ(){
  const W=stage.clientWidth, H=stage.clientHeight, w=base0.w*z.s, h=base0.h*z.s;
  z.x = w<=W ? (W-w)/2 : Math.min(0,Math.max(W-w,z.x));
  z.y = h<=H ? (H-h)/2 : Math.min(0,Math.max(H-h,z.y));
}
function applyZ(){ clampZ(); if(cv) cv.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`; $('lbZ').textContent = z.s>1.02 ? `${Math.round(z.s*100)}%` : 'Pinch or double tap to zoom'; }
function resetZoom(){ z={s:1,x:0,y:0}; applyZ(); }
function zoomAt(ns,px,py){
  ns=Math.max(1,Math.min(6,ns));
  const r=stage.getBoundingClientRect(), cx=px-r.left, cy=py-r.top;
  z.x = cx-(cx-z.x)*(ns/z.s); z.y = cy-(cy-z.y)*(ns/z.s); z.s=ns; applyZ();
}
const pts=new Map(); let gest=null, lastTap=0;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const now=Date.now();
    if(now-lastTap<300){ zoomAt(z.s>1.2?1:2.5,e.clientX,e.clientY); lastTap=0; gest=null; return; }
    lastTap=now;
    gest={type:'pan',sx:e.clientX,sy:e.clientY,ox:z.x,oy:z.y,s0:z.s,moved:false};
  } else if(pts.size===2){
    const [a,b]=[...pts.values()];
    gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),s0:z.s};
  }
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!gest) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.type==='pinch'&&pts.size>=2){
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt(gest.s0*d/gest.d0,(a.x+b.x)/2,(a.y+b.y)/2);
  } else if(gest.type==='pan'){
    const dx=e.clientX-gest.sx, dy=e.clientY-gest.sy;
    if(Math.abs(dx)+Math.abs(dy)>6) gest.moved=true;
    if(z.s>1.02){ z.x=gest.ox+dx; z.y=gest.oy+dy; applyZ(); }
  }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if(gest&&gest.type==='pan'&&pts.size===0&&gest.s0<=1.02&&z.s<=1.02){
    const dx=e.clientX-gest.sx, dy=e.clientY-gest.sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ showLbPage(cur+(dx<0?1:-1)); }
    else if(dy>110&&Math.abs(dy)>Math.abs(dx)*1.5){ closeLb(); }
  }
  if(pts.size===0){ gest=null; if(z.s<1.02) resetZoom(); }
  else if(pts.size===1){ const p=[...pts.values()][0]; gest={type:'pan',sx:p.x,sy:p.y,ox:z.x,oy:z.y,s0:z.s,moved:true}; }
}
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(z.s*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY)},{passive:false});
$('lbX').onclick=closeLb;
$('lbPrev').onclick=()=>showLbPage(cur-1);
$('lbNext').onclick=()=>showLbPage(cur+1);
document.addEventListener('keydown',e=>{
  if(lb.hidden) return;
  if(e.key==='Escape') closeLb(); else if(e.key==='ArrowRight') showLbPage(cur+1); else if(e.key==='ArrowLeft') showLbPage(cur-1);
});
window.addEventListener('resize',()=>{ if(!lb.hidden) showLbPage(cur); });

/* ---------- start ---------- */
function fromToken(t){
  if(!t) return null;
  for(const g of DATA) for(const s of g.sections) if(`${g.id}-${s.id}`===t) return [g,s];
  for(const g of DATA) if(g.id===t) return [g,g.sections.find(s=>s.id!=='index')];
  return null;
}
const start=fromToken(location.hash.slice(1))||fromToken(recall('pcp-view'))||[DATA[0],DATA[0].sections[1]];
select(start[0],start[1],{scroll:false});
</script>
